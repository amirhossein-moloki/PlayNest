name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  SCARF_ANALYTICS: 'false'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: sayra

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'sayra/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run tests with coverage
      run: npm run test:cov
      env:
        JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
        JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars
        JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-minimum-32-chars
