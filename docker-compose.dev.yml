services:
  sayra:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    environment:
      - NODE_ENV=development
      - RUN_SEED=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:-change_this_secure_password_in_production}@db:5432/${POSTGRES_DB:-playenest_prod}
      - REDIS_URL=redis://redis:6379
      - ZIBAL_MERCHANT=${ZIBAL_MERCHANT:-zibal}
      - ZIBAL_CALLBACK_URL=${ZIBAL_CALLBACK_URL:-http://localhost:3000/api/v1/payments/zibal/callback}
      - SKIP_OTP=${SKIP_OTP:-false}
    volumes:
      - ./sayra:/app
      - /app/node_modules
    working_dir: /app
    command: ["sh", "-c", "npm install && npx prisma generate && ./scripts/migrate.sh && npm run dev"]

  blog_web:
    build:
      context: ./Blog
      dockerfile: Dockerfile
    environment:
      - DEBUG=True
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${POSTGRES_USER:-playenest_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_secure_password_in_production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:-change_this_secure_password_in_production}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=dev-secret-key-blog-playnest
      - CORS_ALLOW_ALL_ORIGINS=True
      - CORS_ALLOW_CREDENTIALS=True
    volumes:
      - ./Blog:/app
      - blog_static:/app/staticfiles
      - blog_media:/app/media
