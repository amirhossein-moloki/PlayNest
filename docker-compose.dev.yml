services:
  sayra:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    environment:
      - NODE_ENV=development
      - RUN_SEED=${RUN_SEED:-true}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:-change_this_secure_password_in_production}@db:5432/${POSTGRES_DB:-playenest_prod}
      - REDIS_URL=redis://redis:6379
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-payload_db}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev_access_secret_32_characters_minimum_length}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret_32_characters_minimum_length}
      - STATIC_API_KEY=${STATIC_API_KEY:-dev_static_api_key_for_testing}
      - PAYMENT_PROVIDER_WEBHOOK_SECRET=${PAYMENT_PROVIDER_WEBHOOK_SECRET:-dev_webhook_secret}
    volumes:
      - ./sayra:/app
      - /app/node_modules
    working_dir: /app
    command: ["sh", "-c", "npm install && npx prisma generate && ./scripts/migrate.sh && npm run dev"]

  payload:
    build:
      context: ./payload
      dockerfile: Dockerfile
      target: deps
    environment:
      - NODE_ENV=development
      - DATABASE_URI=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:-change_this_secure_password_in_production}@db:5432/${PAYLOAD_POSTGRES_DB:-payload_db}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-dev_payload_secret_32_characters_minimum_length}
    volumes:
      - ./payload:/app
      - /app/node_modules
    working_dir: /app
    command: ["pnpm", "dev"]
