services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playenest_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-playenest_prod}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-blog_prod}
      BLOG_POSTGRES_DB: ${BLOG_POSTGRES_DB:-blog_prod}
      SAYRA_DB_USER: ${SAYRA_DB_USER:-sayra_app}
      SAYRA_DB_PASSWORD: ${SAYRA_DB_PASSWORD:?SAYRA_DB_PASSWORD environment variable is required}
      BLOG_DB_USER: ${BLOG_DB_USER:-blog_app}
      BLOG_DB_PASSWORD: ${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    command:
      [
        "postgres",
        "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}",
        "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}",
        "-c", "work_mem=${POSTGRES_WORK_MEM:-8MB}",
        "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-150}",
        "-c", "statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-15000}",
      ]
    cpus: ${DB_CPUS:-1.5}
    mem_limit: ${DB_MEM_LIMIT:-2g}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    networks:
      - sayra_internal
      - blog_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playenest_admin} -d ${POSTGRES_DB:-playenest_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      - SAYRA_REDIS_PASSWORD=${SAYRA_REDIS_PASSWORD:?SAYRA_REDIS_PASSWORD environment variable is required}
    # BullMQ queue state requires noeviction so active/delayed jobs are never dropped;
    # all HTTP/DTO cache keys set bounded EX TTLs to prevent unbounded growth within maxmemory.
    command:
      [
        "redis-server",
        "--maxmemory", "${SAYRA_REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy", "noeviction",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--requirepass", "${SAYRA_REDIS_PASSWORD:?SAYRA_REDIS_PASSWORD environment variable is required}",
      ]
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEM_LIMIT:-768m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    networks:
      - sayra_internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$SAYRA_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  sayra:
    image: playenest-sayra:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - WORKERS_ENABLED=${WORKERS_ENABLED:-false}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # NOTE: Each concurrent Argon2 password hash allocates ~64 MiB native RAM; size container RAM >= 1 GiB when tuning UV_THREADPOOL_SIZE.
      - UV_THREADPOOL_SIZE=${UV_THREADPOOL_SIZE:-8}
      - POSTGRES_USER=${SAYRA_DB_USER:-sayra_app}
      - POSTGRES_DB=${POSTGRES_DB:-playenest_prod}
      - POSTGRES_MULTIPLE_DATABASES=
      - POSTGRES_PASSWORD=
      - BLOG_DB_PASSWORD=
      - BLOG_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - DATABASE_URL=postgresql://${SAYRA_DB_USER:-sayra_app}:${SAYRA_DB_PASSWORD:?SAYRA_DB_PASSWORD environment variable is required}@db:5432/${POSTGRES_DB:-playenest_prod}?connection_limit=${DB_CONNECTION_LIMIT:-15}&pool_timeout=${DB_POOL_TIMEOUT:-10}
      - REDIS_URL=redis://:${SAYRA_REDIS_PASSWORD:?SAYRA_REDIS_PASSWORD environment variable is required}@redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET environment variable is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required}
      - PLATFORM_ADMIN_TOTP_ENCRYPTION_KEY=${PLATFORM_ADMIN_TOTP_ENCRYPTION_KEY:?PLATFORM_ADMIN_TOTP_ENCRYPTION_KEY environment variable is required}
      - PLATFORM_ADMIN_TOTP_ISSUER=${PLATFORM_ADMIN_TOTP_ISSUER:-PlayNest}
      - PLATFORM_ADMIN_ACCESS_EXPIRES_IN=${PLATFORM_ADMIN_ACCESS_EXPIRES_IN:-15m}
      - PLATFORM_ADMIN_REFRESH_EXPIRES_IN=${PLATFORM_ADMIN_REFRESH_EXPIRES_IN:-12h}
      - PLATFORM_ADMIN_CHALLENGE_TTL_SECONDS=${PLATFORM_ADMIN_CHALLENGE_TTL_SECONDS:-300}
      - PLATFORM_ADMIN_SETUP_TTL_SECONDS=${PLATFORM_ADMIN_SETUP_TTL_SECONDS:-600}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET environment variable is required}
      - ADMIN_COOKIE_SECRET=${ADMIN_COOKIE_SECRET:?ADMIN_COOKIE_SECRET environment variable is required}
      - PAYMENT_PROVIDER_WEBHOOK_SECRET=${PAYMENT_PROVIDER_WEBHOOK_SECRET:?PAYMENT_PROVIDER_WEBHOOK_SECRET environment variable is required}
      - SAYRA_SMTP_HOST=${SAYRA_SMTP_HOST:-}
      - SAYRA_SMTP_PORT=${SAYRA_SMTP_PORT:-587}
      - SAYRA_SMTP_USER=${SAYRA_SMTP_USER:-}
      - SAYRA_SMTP_PASSWORD=${SAYRA_SMTP_PASSWORD:-}
      - SAYRA_SMTP_SECURE=${SAYRA_SMTP_SECURE:-false}
      - SAYRA_SMTP_FROM_EMAIL=${SAYRA_SMTP_FROM_EMAIL:-noreply@playenest.com}
      - SAYRA_SMTP_FROM_NAME=${SAYRA_SMTP_FROM_NAME:-PlayNest Sayra}
      - SAYRA_SMTP_REPLY_TO=${SAYRA_SMTP_REPLY_TO:-support@playenest.com}
      - DEFAULT_PAYMENT_PROVIDER=${DEFAULT_PAYMENT_PROVIDER:-ZIBAL}
      - ZIBAL_MERCHANT=${ZIBAL_MERCHANT:?ZIBAL_MERCHANT environment variable is required}
      - ZIBAL_CALLBACK_URL=${ZIBAL_CALLBACK_URL:-https://api.sayra-booking.ir/api/v1/payments/zibal/callback}
      - ZARINPAL_CALLBACK_URL=${ZARINPAL_CALLBACK_URL:-https://playnest.com/api/v1/payments/callback}
      - FRONTEND_URL=${FRONTEND_URL:-https://sayra-booking.ir}
      - PAYMENT_SUCCESS_URL=${PAYMENT_SUCCESS_URL:-https://sayra-booking.ir/payment/success}
      - PAYMENT_FAILED_URL=${PAYMENT_FAILED_URL:-https://sayra-booking.ir/payment/failed}
      - SKIP_OTP=${SKIP_OTP:-false}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-5}
      - OTP_EXPIRATION_MINUTES=${OTP_EXPIRATION_MINUTES:-2}
      - OTP_REQUEST_RATE_LIMIT_PHONE=${OTP_REQUEST_RATE_LIMIT_PHONE:-3}
      - OTP_REQUEST_RATE_LIMIT_IP=${OTP_REQUEST_RATE_LIMIT_IP:-10}
      - INTERNAL_SSR_SECRET=${INTERNAL_SSR_SECRET:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - RANKING_BAYESIAN_M=${RANKING_BAYESIAN_M:-3}
      - RANKING_MIN_REVIEWS_DEFAULT=${RANKING_MIN_REVIEWS_DEFAULT:-3}
      - BLOG_WEBHOOK_URL=${BLOG_WEBHOOK_URL:-http://blog-web:8000/api/integrations/webhooks/sayra-events/}
      - BLOG_WEBHOOK_SECRET=${BLOG_WEBHOOK_SECRET:-}
      - INTEGRATION_OUTBOX_ENABLED=${INTEGRATION_OUTBOX_ENABLED:-true}
    cpus: ${SAYRA_CPUS:-1.0}
    mem_limit: ${SAYRA_MEM_LIMIT:-1g}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - app_storage:/app/storage
      - app_uploads:/app/uploads
    networks:
      - edge
      - inter_service
      - sayra_internal
    command: ["./scripts/wait-for-db.sh", "db", "node", "dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sayra-worker:
    image: playenest-sayra:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - WORKERS_ENABLED=true
      - UV_THREADPOOL_SIZE=${WORKER_UV_THREADPOOL_SIZE:-4}
      - POSTGRES_USER=${SAYRA_DB_USER:-sayra_app}
      - POSTGRES_DB=${POSTGRES_DB:-playenest_prod}
      - POSTGRES_MULTIPLE_DATABASES=
      - POSTGRES_PASSWORD=
      - BLOG_DB_PASSWORD=
      - BLOG_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - DATABASE_URL=postgresql://${SAYRA_DB_USER:-sayra_app}:${SAYRA_DB_PASSWORD:?SAYRA_DB_PASSWORD environment variable is required}@db:5432/${POSTGRES_DB:-playenest_prod}?connection_limit=${WORKER_DB_CONNECTION_LIMIT:-10}&pool_timeout=${DB_POOL_TIMEOUT:-10}
      - REDIS_URL=redis://:${SAYRA_REDIS_PASSWORD:?SAYRA_REDIS_PASSWORD environment variable is required}@redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET environment variable is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required}
      - PLATFORM_ADMIN_TOTP_ENCRYPTION_KEY=${PLATFORM_ADMIN_TOTP_ENCRYPTION_KEY:?PLATFORM_ADMIN_TOTP_ENCRYPTION_KEY environment variable is required}
      - PLATFORM_ADMIN_TOTP_ISSUER=${PLATFORM_ADMIN_TOTP_ISSUER:-PlayNest}
      - PLATFORM_ADMIN_ACCESS_EXPIRES_IN=${PLATFORM_ADMIN_ACCESS_EXPIRES_IN:-15m}
      - PLATFORM_ADMIN_REFRESH_EXPIRES_IN=${PLATFORM_ADMIN_REFRESH_EXPIRES_IN:-12h}
      - PLATFORM_ADMIN_CHALLENGE_TTL_SECONDS=${PLATFORM_ADMIN_CHALLENGE_TTL_SECONDS:-300}
      - PLATFORM_ADMIN_SETUP_TTL_SECONDS=${PLATFORM_ADMIN_SETUP_TTL_SECONDS:-600}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET environment variable is required}
      - ADMIN_COOKIE_SECRET=${ADMIN_COOKIE_SECRET:?ADMIN_COOKIE_SECRET environment variable is required}
      - PAYMENT_PROVIDER_WEBHOOK_SECRET=${PAYMENT_PROVIDER_WEBHOOK_SECRET:?PAYMENT_PROVIDER_WEBHOOK_SECRET environment variable is required}
      - SAYRA_SMTP_HOST=${SAYRA_SMTP_HOST:-}
      - SAYRA_SMTP_PORT=${SAYRA_SMTP_PORT:-587}
      - SAYRA_SMTP_USER=${SAYRA_SMTP_USER:-}
      - SAYRA_SMTP_PASSWORD=${SAYRA_SMTP_PASSWORD:-}
      - SAYRA_SMTP_SECURE=${SAYRA_SMTP_SECURE:-false}
      - SAYRA_SMTP_FROM_EMAIL=${SAYRA_SMTP_FROM_EMAIL:-noreply@playenest.com}
      - SAYRA_SMTP_FROM_NAME=${SAYRA_SMTP_FROM_NAME:-PlayNest Sayra}
      - SAYRA_SMTP_REPLY_TO=${SAYRA_SMTP_REPLY_TO:-support@playenest.com}
      - DEFAULT_PAYMENT_PROVIDER=${DEFAULT_PAYMENT_PROVIDER:-ZIBAL}
      - ZIBAL_MERCHANT=${ZIBAL_MERCHANT:?ZIBAL_MERCHANT environment variable is required}
      - ZIBAL_CALLBACK_URL=${ZIBAL_CALLBACK_URL:-https://api.sayra-booking.ir/api/v1/payments/zibal/callback}
      - ZARINPAL_CALLBACK_URL=${ZARINPAL_CALLBACK_URL:-https://playnest.com/api/v1/payments/callback}
      - FRONTEND_URL=${FRONTEND_URL:-https://sayra-booking.ir}
      - PAYMENT_SUCCESS_URL=${PAYMENT_SUCCESS_URL:-https://sayra-booking.ir/payment/success}
      - PAYMENT_FAILED_URL=${PAYMENT_FAILED_URL:-https://sayra-booking.ir/payment/failed}
      - BLOG_WEBHOOK_URL=${BLOG_WEBHOOK_URL:-http://blog-web:8000/api/integrations/webhooks/sayra-events/}
      - BLOG_WEBHOOK_SECRET=${BLOG_WEBHOOK_SECRET:-}
      - INTEGRATION_OUTBOX_POLL_INTERVAL_MS=${INTEGRATION_OUTBOX_POLL_INTERVAL_MS:-10000}
      - INTEGRATION_OUTBOX_BATCH_SIZE=${INTEGRATION_OUTBOX_BATCH_SIZE:-25}
      - INTEGRATION_OUTBOX_ENABLED=${INTEGRATION_OUTBOX_ENABLED:-true}
    cpus: ${SAYRA_WORKER_CPUS:-0.5}
    mem_limit: ${SAYRA_WORKER_MEM_LIMIT:-768m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - app_storage:/app/storage
      - app_uploads:/app/uploads
    networks:
      - egress
      - inter_service
      - sayra_internal
    command: ["./scripts/wait-for-db.sh", "db", "node", "dist/worker.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "const net = require('net'); const u = new URL(process.env.REDIS_URL || 'redis://redis:6379'); const s = net.connect(Number(u.port || 6379), u.hostname); let authed = !u.password; s.on('connect', () => { if (u.password) { const p = decodeURIComponent(u.password); s.write('*2\\r\\n$4\\r\\nAUTH\\r\\n$' + Buffer.byteLength(p) + '\\r\\n' + p + '\\r\\n'); } else { s.write('*1\\r\\n$4\\r\\nPING\\r\\n'); } }); s.on('data', (d) => { const str = d.toString(); if (!authed) { if (str.startsWith('+OK')) { authed = true; s.write('*1\\r\\n$4\\r\\nPING\\r\\n'); return; } s.destroy(); process.exit(1); } const ok = str.includes('PONG'); s.destroy(); process.exit(ok ? 0 : 1); }); s.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  blog_redis:
    image: redis:7-alpine
    restart: always
    environment:
      - BLOG_REDIS_PASSWORD=${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}
    command:
      [
        "redis-server",
        "--maxmemory", "${BLOG_REDIS_MAXMEMORY:-256mb}",
        "--maxmemory-policy", "noeviction",
        "--requirepass", "${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}",
      ]
    cpus: ${BLOG_REDIS_CPUS:-0.25}
    mem_limit: ${BLOG_REDIS_MEM_LIMIT:-384m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog_redis_data:/data
    networks:
      - blog_internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$BLOG_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog_migrate:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${BLOG_DB_USER:-blog_app}
      - POSTGRES_PASSWORD=${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${BLOG_DB_USER:-blog_app}:${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}@blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:?BLOG_SECRET_KEY environment variable is required}
      - SAYRA_DB_PASSWORD=
      - SAYRA_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - RUN_MIGRATIONS=true
      - RUN_COLLECTSTATIC=true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog_static:/app/staticfiles
      - blog_media:/app/media
    networks:
      - blog_internal
    command: ["sh", "-c", "python manage.py migrate --no-input && python manage.py collectstatic --no-input"]

  blog_web:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    expose:
      - '8000'
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
      blog_migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${BLOG_DB_USER:-blog_app}
      - POSTGRES_PASSWORD=${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${BLOG_DB_USER:-blog_app}:${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}@blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:?BLOG_SECRET_KEY environment variable is required}
      - SAYRA_DB_PASSWORD=
      - SAYRA_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - DEBUG=${BLOG_DEBUG:-False}
      - DOMAIN=${BLOG_DOMAIN:-blog.sayra-booking.ir}
      - ALLOWED_HOSTS=${BLOG_ALLOWED_HOSTS:-blog.sayra-booking.ir,sayra-booking.ir,api.sayra-booking.ir},blog-web
      - CSRF_TRUSTED_ORIGINS=${BLOG_CSRF_TRUSTED_ORIGINS:-https://blog.sayra-booking.ir,https://sayra-booking.ir}
      - CORS_ALLOWED_ORIGINS=${BLOG_CORS_ALLOWED_ORIGINS:-https://blog.sayra-booking.ir,https://sayra-booking.ir}
      - CORS_ALLOW_ALL_ORIGINS=${BLOG_CORS_ALLOW_ALL_ORIGINS:-False}
      - CORS_ALLOW_CREDENTIALS=${BLOG_CORS_ALLOW_CREDENTIALS:-True}
      - RUN_MIGRATIONS=${BLOG_RUN_MIGRATIONS:-false}
      - RUN_COLLECTSTATIC=${BLOG_RUN_COLLECTSTATIC:-false}
      - GUNICORN_WORKERS=${BLOG_GUNICORN_WORKERS:-3}
      - SAYRA_API_BASE_URL=${SAYRA_API_BASE_URL:-http://sayra:3000/api/v1}
      - SAYRA_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - SAYRA_SSR_SECRET=${INTERNAL_SSR_SECRET:-}
      - SAYRA_WEBHOOK_SECRET=${BLOG_WEBHOOK_SECRET:-}
      - NEXT_REVALIDATE_URL=${NEXT_REVALIDATE_URL:-}
      - NEXT_REVALIDATION_SECRET=${NEXT_REVALIDATION_SECRET:-}
      - SITE_PUBLIC_URL=${FRONTEND_URL:-https://www.sayra-booking.ir}
    cpus: ${BLOG_WEB_CPUS:-1.0}
    mem_limit: ${BLOG_WEB_MEM_LIMIT:-1g}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog_static:/app/staticfiles
      - blog_media:/app/media
    command: sh -c "/usr/local/bin/docker-entrypoint.sh"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      edge:
      inter_service:
        aliases:
          - blog-web
      blog_internal:

  blog_celery_default:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${BLOG_DB_USER:-blog_app}
      - POSTGRES_PASSWORD=${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${BLOG_DB_USER:-blog_app}:${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}@blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:?BLOG_SECRET_KEY environment variable is required}
      - SAYRA_DB_PASSWORD=
      - SAYRA_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - DEBUG=${BLOG_DEBUG:-False}
      - SAYRA_API_BASE_URL=${SAYRA_API_BASE_URL:-http://sayra:3000/api/v1}
      - SAYRA_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - SAYRA_SSR_SECRET=${INTERNAL_SSR_SECRET:-}
      - NEXT_REVALIDATE_URL=${NEXT_REVALIDATE_URL:-}
      - NEXT_REVALIDATION_SECRET=${NEXT_REVALIDATION_SECRET:-}
    cpus: ${BLOG_CELERY_CPUS:-0.5}
    mem_limit: ${BLOG_CELERY_MEM_LIMIT:-512m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog_media:/app/media
    networks:
      - egress
      - inter_service
      - blog_internal
    command: celery -A blog worker -l info -Q default

  blog_celery_high:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${BLOG_DB_USER:-blog_app}
      - POSTGRES_PASSWORD=${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${BLOG_DB_USER:-blog_app}:${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}@blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:?BLOG_SECRET_KEY environment variable is required}
      - SAYRA_DB_PASSWORD=
      - SAYRA_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - DEBUG=${BLOG_DEBUG:-False}
      - NEXT_REVALIDATE_URL=${NEXT_REVALIDATE_URL:-}
      - NEXT_REVALIDATION_SECRET=${NEXT_REVALIDATION_SECRET:-}
    cpus: ${BLOG_CELERY_CPUS:-0.5}
    mem_limit: ${BLOG_CELERY_MEM_LIMIT:-512m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog_media:/app/media
    networks:
      - egress
      - inter_service
      - blog_internal
    command: celery -A blog worker -l info -Q high_priority

  blog_celery_low:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${BLOG_DB_USER:-blog_app}
      - POSTGRES_PASSWORD=${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${BLOG_DB_USER:-blog_app}:${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}@blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:?BLOG_SECRET_KEY environment variable is required}
      - SAYRA_DB_PASSWORD=
      - SAYRA_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - DEBUG=${BLOG_DEBUG:-False}
    cpus: ${BLOG_CELERY_CPUS:-0.5}
    mem_limit: ${BLOG_CELERY_MEM_LIMIT:-512m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog_media:/app/media
    networks:
      - blog_internal
    command: celery -A blog worker -l info -Q low_priority

  blog_celery_beat:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${BLOG_DB_USER:-blog_app}
      - POSTGRES_PASSWORD=${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${BLOG_DB_USER:-blog_app}:${BLOG_DB_PASSWORD:?BLOG_DB_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}@blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:?BLOG_SECRET_KEY environment variable is required}
      - SAYRA_DB_PASSWORD=
      - SAYRA_REDIS_PASSWORD=
      - RESTIC_PASSWORD=
      - DEBUG=${BLOG_DEBUG:-False}
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog_media:/app/media
    networks:
      - blog_internal
    command: celery -A blog beat -l info -s /tmp/celerybeat-schedule

  nginx:
    image: playenest-nginx:latest
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - '80:80'
      - "443:443"
    environment:
      - MEDIA_LOCAL_PUBLIC_PATH=/media
      - PLAYNEST_DOMAIN=${PLAYNEST_DOMAIN:-sayra-booking.ir}
      - BLOG_DOMAIN=${BLOG_DOMAIN:-blog.sayra-booking.ir}
      - API_DOMAIN=${API_DOMAIN:-api.sayra-booking.ir}
      - INTERNAL_SSR_SECRET=${INTERNAL_SSR_SECRET:?INTERNAL_SSR_SECRET environment variable is required}
      - NGINX_ENVSUBST_FILTER=^(MEDIA_LOCAL_PUBLIC_PATH|PLAYNEST_DOMAIN|BLOG_DOMAIN|API_DOMAIN|INTERNAL_SSR_SECRET)$
    cpus: ${NGINX_CPUS:-0.5}
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - app_storage:/app/storage:ro
      - app_uploads:/app/uploads:ro
      - blog_static:/app/blog_static:ro
      - blog_media:/app/blog_media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - edge
    depends_on:
      sayra:
        condition: service_healthy
      blog_web:
        condition: service_healthy

  backup:
    image: playenest-backup:latest
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-playenest_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - POSTGRES_DB=${POSTGRES_DB:-playenest_prod}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-blog_prod}
      - BLOG_POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - SAYRA_DB_USER=${SAYRA_DB_USER:-sayra_app}
      - BLOG_DB_USER=${BLOG_DB_USER:-blog_app}
      - SAYRA_REDIS_PASSWORD=${SAYRA_REDIS_PASSWORD:?SAYRA_REDIS_PASSWORD environment variable is required}
      - BLOG_REDIS_PASSWORD=${BLOG_REDIS_PASSWORD:?BLOG_REDIS_PASSWORD environment variable is required}
      - RESTIC_REPOSITORY=/backups
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:?RESTIC_PASSWORD environment variable is required}
      - BACKUP_CRON=0 * * * *
      - RETENTION_HOURLY=24
      - RETENTION_DAILY=7
      - RETENTION_WEEKLY=4
      - RETENTION_MONTHLY=12
    healthcheck:
      test: ["CMD-SHELL", "[ -f /var/log/last_success_backup ] && [ $$(($$(date +%s) - $$(cat /var/log/last_success_backup))) -lt 7200 ]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - sayra_internal
      - blog_internal
    volumes:
      - app_storage:/storage:ro
      - app_uploads:/uploads:ro
      - blog_media:/blog_media:ro
      - redis_data:/redis_data:ro
      - blog_redis_data:/blog_redis_data:ro
      - ./docker/nginx:/nginx_config:ro
      - ${BACKUP_HOST_DIR:-/var/backups/playnest}:/backups
      - backup_data:/data
      - ${BACKUP_ENV_FILE:-./docker/backup/backups.env.example}:/config/.env:ro
      - ./docker-compose.yml:/project_root/docker-compose.yml:ro

networks:
  edge:
    driver: bridge
  inter_service:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  sayra_internal:
    driver: bridge
    internal: true
  blog_internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_uploads:
  blog_redis_data:
  blog_static:
  blog_media:
  backup_data:
