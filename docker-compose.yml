services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playenest_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secure_password_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-playenest_prod}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-payload_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playenest_admin} -d ${POSTGRES_DB:-playenest_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sayra:
    image: playenest-sayra:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:-change_this_secure_password_in_production}@db:5432/${POSTGRES_DB:-playenest_prod}
      - REDIS_URL=redis://redis:6379
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-payload_db}
    volumes:
      - app_storage:/app/storage
    command: ["./scripts/wait-for-db.sh", "db", "node", "dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payload:
    image: playenest-payload:latest
    build:
      context: ./payload
      dockerfile: Dockerfile
    restart: always
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PAYLOAD_DB_PUSH=true
      - DATABASE_URI=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:-change_this_secure_password_in_production}@db:5432/${PAYLOAD_POSTGRES_DB:-payload_db}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-change_this_payload_secret_in_production}
    volumes:
      - payload_media:/app/public/media
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/admin || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: playenest-nginx:latest
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - '80:80'
    environment:
      - MEDIA_LOCAL_PUBLIC_PATH=/media
      - NGINX_ENVSUBST_FILTER=MEDIA_LOCAL_PUBLIC_PATH
    volumes:
      - app_storage:/app/storage:ro
      - payload_media:/app/payload_media:ro
    depends_on:
      sayra:
        condition: service_healthy
      payload:
        condition: service_healthy

  backup:
    image: playenest-backup:latest
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - RESTIC_REPOSITORY=/backups
      - BACKUP_CRON=0 * * * *
      - RETENTION_HOURLY=24
      - RETENTION_DAILY=7
      - RETENTION_WEEKLY=4
      - RETENTION_MONTHLY=12
    healthcheck:
      test: ["CMD-SHELL", "[ -f /var/log/last_success_backup ] && [ $$(($$(date +%s) - $$(cat /var/log/last_success_backup))) -lt 7200 ]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - app_storage:/storage:ro
      - redis_data:/redis_data:ro
      - ./docker/nginx:/nginx_config:ro
      - ./backups:/backups
      - backup_data:/data
      - .env:/.env:ro
      - ./docker-compose.yml:/project_root/docker-compose.yml:ro

volumes:
  postgres_data:
  redis_data:
  app_storage:
  payload_media:
  backup_data:
