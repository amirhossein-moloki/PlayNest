services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playenest_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-playenest_prod}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-blog_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playenest_admin} -d ${POSTGRES_DB:-playenest_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sayra:
    image: playenest-sayra:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}@db:5432/${POSTGRES_DB:-playenest_prod}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET environment variable is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required}
      - PAYMENT_PROVIDER_WEBHOOK_SECRET=${PAYMENT_PROVIDER_WEBHOOK_SECRET:?PAYMENT_PROVIDER_WEBHOOK_SECRET environment variable is required}
      - SAYRA_SMTP_HOST=${SAYRA_SMTP_HOST:-}
      - SAYRA_SMTP_PORT=${SAYRA_SMTP_PORT:-587}
      - SAYRA_SMTP_USER=${SAYRA_SMTP_USER:-}
      - SAYRA_SMTP_PASSWORD=${SAYRA_SMTP_PASSWORD:-}
      - SAYRA_SMTP_SECURE=${SAYRA_SMTP_SECURE:-false}
      - SAYRA_SMTP_FROM_EMAIL=${SAYRA_SMTP_FROM_EMAIL:-noreply@playenest.com}
      - SAYRA_SMTP_FROM_NAME=${SAYRA_SMTP_FROM_NAME:-PlayNest Sayra}
      - SAYRA_SMTP_REPLY_TO=${SAYRA_SMTP_REPLY_TO:-support@playenest.com}
      - ZIBAL_MERCHANT=${ZIBAL_MERCHANT:-zibal}
      - ZIBAL_CALLBACK_URL=${ZIBAL_CALLBACK_URL:-https://playnest.com/api/v1/payments/zibal/callback}
    volumes:
      - app_storage:/app/storage
      - app_uploads:/app/uploads
    command: ["./scripts/wait-for-db.sh", "db", "node", "dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  blog_redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - blog_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog_web:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    expose:
      - '8000'
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${POSTGRES_USER:-playenest_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:-replace-this-with-a-very-secret-key-for-blog}
      - DEBUG=${BLOG_DEBUG:-False}
      - DOMAIN=${BLOG_DOMAIN:-blog.sayra-booking.ir}
      - ALLOWED_HOSTS=${BLOG_ALLOWED_HOSTS:-localhost,127.0.0.1,51.20.249.108,blog.sayra-booking.ir,sayra-booking.ir,api.sayra-booking.ir,blog.playnest.com}
      - CSRF_TRUSTED_ORIGINS=${BLOG_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://blog.sayra-booking.ir,https://blog.sayra-booking.ir,http://sayra-booking.ir,https://sayra-booking.ir,http://51.20.249.108}
      - CORS_ALLOWED_ORIGINS=${BLOG_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://blog.sayra-booking.ir,https://blog.sayra-booking.ir,http://sayra-booking.ir,https://sayra-booking.ir}
      - CORS_ALLOW_ALL_ORIGINS=${BLOG_CORS_ALLOW_ALL_ORIGINS:-False}
      - CORS_ALLOW_CREDENTIALS=${BLOG_CORS_ALLOW_CREDENTIALS:-True}
    volumes:
      - blog_static:/app/staticfiles
      - blog_media:/app/media
    command: sh -c "/usr/local/bin/docker-entrypoint.sh"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  blog_celery_default:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${POSTGRES_USER:-playenest_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:-replace-this-with-a-very-secret-key-for-blog}
      - DEBUG=${BLOG_DEBUG:-False}
    volumes:
      - blog_media:/app/media
    command: celery -A blog worker -l info -Q default

  blog_celery_high:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${POSTGRES_USER:-playenest_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:-replace-this-with-a-very-secret-key-for-blog}
      - DEBUG=${BLOG_DEBUG:-False}
    volumes:
      - blog_media:/app/media
    command: celery -A blog worker -l info -Q high_priority

  blog_celery_low:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${POSTGRES_USER:-playenest_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:-replace-this-with-a-very-secret-key-for-blog}
      - DEBUG=${BLOG_DEBUG:-False}
    volumes:
      - blog_media:/app/media
    command: celery -A blog worker -l info -Q low_priority

  blog_celery_beat:
    image: playenest-blog:latest
    build:
      context: ./Blog
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./Blog/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${BLOG_POSTGRES_DB:-blog_prod}
      - POSTGRES_USER=${POSTGRES_USER:-playenest_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playenest_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}@db:5432/${BLOG_POSTGRES_DB:-blog_prod}
      - REDIS_HOST=blog_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://blog_redis:6379
      - USE_REDIS=True
      - SECRET_KEY=${BLOG_SECRET_KEY:-replace-this-with-a-very-secret-key-for-blog}
      - DEBUG=${BLOG_DEBUG:-False}
    volumes:
      - blog_media:/app/media
    command: celery -A blog beat -l info

  nginx:
    image: playenest-nginx:latest
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - '80:80'
      - "443:443"
    environment:
      - MEDIA_LOCAL_PUBLIC_PATH=/media
      - PLAYNEST_DOMAIN=${PLAYNEST_DOMAIN:-sayra-booking.ir}
      - BLOG_DOMAIN=${BLOG_DOMAIN:-blog.sayra-booking.ir}
      - API_DOMAIN=${API_DOMAIN:-api.sayra-booking.ir}
      - NGINX_ENVSUBST_FILTER=^(MEDIA_LOCAL_PUBLIC_PATH|PLAYNEST_DOMAIN|BLOG_DOMAIN|API_DOMAIN)$
    volumes:
      - app_storage:/app/storage:ro
      - blog_static:/app/blog_static:ro
      - blog_media:/app/blog_media:ro
      - app_storage:/app/storage:ro
      - blog_static:/app/blog_static:ro
      - blog_media:/app/blog_media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      sayra:
        condition: service_healthy
      blog_web:
        condition: service_healthy

  backup:
    image: playenest-backup:latest
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      blog_redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-blog_prod}
      - RESTIC_REPOSITORY=/backups
      - BACKUP_CRON=0 * * * *
      - RETENTION_HOURLY=24
      - RETENTION_DAILY=7
      - RETENTION_WEEKLY=4
      - RETENTION_MONTHLY=12
    healthcheck:
      test: ["CMD-SHELL", "[ -f /var/log/last_success_backup ] && [ $$(($$(date +%s) - $$(cat /var/log/last_success_backup))) -lt 7200 ]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - app_storage:/storage:ro
      - blog_media:/blog_media:ro
      - redis_data:/redis_data:ro
      - blog_redis_data:/blog_redis_data:ro
      - ./docker/nginx:/nginx_config:ro
      - ./backups:/backups
      - backup_data:/data
      - .env:/.env:ro
      - ./docker-compose.yml:/project_root/docker-compose.yml:ro

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_uploads:
  blog_redis_data:
  blog_static:
  blog_media:
  backup_data:
