openapi: 3.0.0
info:
  title: Playenest API
  description: API Documentation for Playenest Gamenet Management System
  version: v1.0-LOCKED
  x-api-contract-version: v1.0-LOCKED
  contact:
    name: Playenest Support
    email: support@playenest.com
servers:
- url: /api/v1
  description: V1 API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token for authenticated user sessions
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Unique error code for machine handling
              enum:
              - INTERNAL_ERROR
              - APP_ERROR
              - VALIDATION_ERROR
              - DB_REQUEST_FAILED
              - NOT_FOUND
              - CONFLICT
              - UNAUTHORIZED
              - FORBIDDEN
              - SLOT_NOT_AVAILABLE
              - RESERVATION_OVERLAP
              - OVERLAP_CONFLICT
              - RESERVATION_START_TIME_IN_PAST
              - INVALID_TRANSITION
              - ONLINE_RESERVATION_DISABLED
              - IDEMPOTENCY_KEY_REQUIRED
              - IDEMPOTENCY_KEY_INVALID_LENGTH
              - IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD
              - IDEMPOTENCY_REQUEST_IN_PROGRESS
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error message
              example: Invalid request payload.
            details:
              type: object
              description: Optional additional error details (e.g., validation issues)
              nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - MANAGER
          - SUPERVISOR
          - STAFF
          - TRAINEE
          - SUPPORT
          - ADMIN
        isActive:
          type: boolean
    Ticket:
      type: object
      properties:
        id:
          type: string
        customerAccountId:
          type: string
        assignedToUserId:
          type: string
          nullable: true
        subject:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - PENDING
          - ANSWERED
          - CLOSED
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        category:
          type: string
          enum:
          - TECHNICAL
          - FINANCIAL
          - SALES
          - ACCOUNT
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
    TicketMessage:
      type: object
      properties:
        id:
          type: string
        ticketId:
          type: string
        senderId:
          type: string
        senderType:
          type: string
          enum:
          - USER
          - SUPPORT
        text:
          type: string
        attachment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    GamingCenter:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    GameStation:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        name:
          type: string
        stationType:
          type: string
          enum:
          - PC
          - PLAYSTATION
          - XBOX
          - SWITCH
          - VR
        isVip:
          type: boolean
        hourlyPrice:
          type: number
        minRentHours:
          type: integer
        maxRentHours:
          type: integer
        defaultDurationHours:
          type: integer
        incrementMinutes:
          type: integer
        isActive:
          type: boolean
    Reservation:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        stationId:
          type: string
        staffId:
          type: string
        customerAccountId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
          - NO_SHOW
        paymentState:
          type: string
          enum:
          - UNPAID
          - PENDING
          - PARTIALLY_PAID
          - PAID
          - REFUNDED
          - OVERPAID
          - FAILED
          - CANCELED
        totalHours:
          type: number
        totalPrice:
          type: number
        stationSnapshot:
          type: object
          properties:
            name:
              type: string
            hourlyPrice:
              type: number
            stationType:
              type: string
    ReservationTimeProposal:
      type: object
      properties:
        id:
          type: string
        reservationId:
          type: string
        originalStartTime:
          type: string
          format: date-time
        originalEndTime:
          type: string
          format: date-time
        proposedStartTime:
          type: string
          format: date-time
        proposedEndTime:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - CANCELLED
        createdByUserId:
          type: string
        customerRespondedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Staff:
      type: object
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          isPublic:
            type: boolean
          publicName:
            type: string
          bio:
            type: string
          avatarUrl:
            type: string
    Customer:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        fullName:
          type: string
        phoneVerifiedAt:
          type: string
          format: date-time
    Meta:
      type: object
      properties:
        requestId:
          type: string
          example: ckv1abc...
        pagination:
          type: object
          properties:
            totalItems:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    Pagination:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/Meta'
    Settings:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        timeZone:
          type: string
        workStartTime:
          type: string
        workEndTime:
          type: string
        allowOnlineBooking:
          type: boolean
        onlineBookingAutoConfirm:
          type: boolean
        preventOverlaps:
          type: boolean
    SiteSettings:
      type: object
      properties:
        logoUrl:
          type: string
        faviconUrl:
          type: string
        defaultSeoTitle:
          type: string
        defaultSeoDescription:
          type: string
        robotsIndex:
          type: string
          enum:
          - INDEX
          - NOINDEX
        robotsFollow:
          type: string
          enum:
          - FOLLOW
          - NOFOLLOW
    CommissionPolicy:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        type:
          type: string
          enum:
          - PERCENT
          - FIXED
        percentBps:
          type: integer
        fixedAmount:
          type: integer
        currency:
          type: string
        monthlyTarget:
          type: integer
          nullable: true
        maxPercentBps:
          type: integer
        isActive:
          type: boolean
    Earning:
      type: object
      properties:
        id:
          type: string
        reservationId:
          type: string
        gamingCenterId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACCRUED
          - CHARGED
          - WAIVED
          - REFUNDED
        commissionAmount:
          type: integer
        currency:
          type: string
        targetPeriod:
          type: string
          nullable: true
        targetReached:
          type: boolean
        targetContribution:
          type: boolean
    Rating:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        reservationId:
          type: string
        rating:
          type: integer
        comment:
          type: string
        status:
          type: string
          enum:
          - PUBLISHED
          - HIDDEN
          - DELETED
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
          - RESERVATION_CREATED
          - RESERVATION_CONFIRMED
          - RESERVATION_REJECTED
          - RESERVATION_CANCELLED
          - RESERVATION_TIME_PROPOSED
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Discount:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        targetType:
          type: string
          enum:
          - GAMING_CENTER
          - STATION
        targetId:
          type: string
        valueType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED_AMOUNT
        value:
          type: number
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WaitlistEntry:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        customerAccountId:
          type: string
        customerProfileId:
          type: string
        stationId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - OFFERED
          - CONVERTED
          - CANCELLED
          - EXPIRED
          - CLOSED
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        convertedReservationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WaitlistOffer:
      type: object
      properties:
        id:
          type: string
        waitlistEntryId:
          type: string
        gamingCenterId:
          type: string
        stationId:
          type: string
        offeredStartTime:
          type: string
          format: date-time
        offeredEndTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - CANCELLED
        expiresAt:
          type: string
          format: date-time
        reservationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogPost:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0812345678
        gamingCenterId:
          type: string
          example: clh1234560000yy0887654321
        slug:
          type: string
          example: esports-tournament-2026
        title:
          type: string
          example: Annual Esports Tournament 2026
        excerpt:
          type: string
          example: Join us for the ultimate gaming showdown.
        content:
          type: string
          example: <p>Full HTML or Markdown article content...</p>
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
          default: DRAFT
        visibility:
          type: string
          enum:
          - PUBLIC
          - PRIVATE
          - MEMBERS_ONLY
          default: PUBLIC
        isHot:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        authorId:
          type: string
          example: clh1234560000yy0811111111
        categoryId:
          type: string
          nullable: true
          example: clh1234560000yy0822222222
        seriesId:
          type: string
          nullable: true
          example: clh1234560000yy0833333333
        coverMediaId:
          type: string
          nullable: true
          example: clh1234560000yy0844444444
        ogImageId:
          type: string
          nullable: true
          example: clh1234560000yy0855555555
        seoTitle:
          type: string
          nullable: true
          example: Esports Tournament 2026 - PlayNest
        seoDescription:
          type: string
          nullable: true
          example: Official announcement and details for 2026 tournament.
        publishedAt:
          type: string
          format: date-time
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/BlogTag'
    BlogSeries:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0833333333
        gamingCenterId:
          type: string
          example: clh1234560000yy0887654321
        slug:
          type: string
          example: setup-guides
        title:
          type: string
          example: Gaming Gear Setup Guides
        description:
          type: string
          nullable: true
          example: Step-by-step guides for optimizing gaming hardware.
        orderStrategy:
          type: string
          enum:
          - MANUAL
          - CHRONOLOGICAL
          - REVERSE_CHRONOLOGICAL
          default: MANUAL
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogCategory:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0822222222
        gamingCenterId:
          type: string
          example: clh1234560000yy0887654321
        name:
          type: string
          example: Tournaments
        slug:
          type: string
          example: tournaments
        description:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        order:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogTag:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0866666666
        gamingCenterId:
          type: string
          example: clh1234560000yy0887654321
        name:
          type: string
          example: Esports
        slug:
          type: string
          example: esports
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogComment:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0877777777
        gamingCenterId:
          type: string
          example: clh1234560000yy0887654321
        postId:
          type: string
          example: clh1234560000yy0812345678
        parentId:
          type: string
          nullable: true
          example: clh1234560000yy0899999999
        authorId:
          type: string
          example: clh1234560000yy0811111111
        content:
          type: string
          example: Great article! Looking forward to the tournament.
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - FLAGGED
          - SPAM
          default: PENDING
        isPinned:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogReactionAggregate:
      type: object
      properties:
        contentType:
          type: string
          enum:
          - post
          - comment
        objectId:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
          example:
            LIKE: 12
            LOVE: 5
            FIRE: 3
    BlogMenu:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0800000001
        gamingCenterId:
          type: string
        name:
          type: string
          example: Main Navigation
        location:
          type: string
          enum:
          - HEADER
          - FOOTER
          - SIDEBAR
          - MOBILE_DRAWER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogMenuItem:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0800000002
        menuId:
          type: string
        parentId:
          type: string
          nullable: true
        label:
          type: string
          example: Blog
        url:
          type: string
          example: /blog
        order:
          type: integer
          default: 0
        targetBlank:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        targetType:
          type: string
          enum:
          - CUSTOM
          - POST
          - CATEGORY
          - TAG
          - SERIES
          - PAGE
          - EXTERNAL
          default: CUSTOM
        targetId:
          type: string
          nullable: true
        visibility:
          type: string
          enum:
          - EVERYONE
          - GUESTS_ONLY
          - LOGGED_IN_ONLY
          - MEMBERS_ONLY
          default: EVERYONE
    PlatformAdmin:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0811111111
        fullName:
          type: string
          example: Super Administrator
        phone:
          type: string
          example: '09121234567'
        email:
          type: string
          nullable: true
          example: admin@playnest.ir
        isActive:
          type: boolean
          example: true
        isSuperuser:
          type: boolean
          example: true
        lastLogin:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GamingCenterExpense:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0812345678
        gamingCenterId:
          type: string
          example: clh1234560000yy0887654321
        category:
          type: string
          enum:
          - RENT
          - ELECTRICITY_ENERGY
          - INTERNET_COMMUNICATION
          - SALARIES_WAGES
          - MAINTENANCE_REPAIR
          - PARTS_EQUIPMENT
          - MARKETING
          - ADMINISTRATIVE
          - OTHER_SERVICES
          - OTHER_DOCUMENTED
        amount:
          type: number
          example: 2500000
        currency:
          type: string
          default: IRR
          example: IRR
        expenseDate:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
          example: High-speed fiber connection bill
        referenceNumber:
          type: string
          nullable: true
          example: INV-98231
        status:
          type: string
          enum:
          - DRAFT
          - APPROVED
          - REJECTED
          - VOID
          default: APPROVED
        createdById:
          type: string
          nullable: true
        approvedById:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Refund:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0899999999
        gamingCenterId:
          type: string
        paymentId:
          type: string
        amount:
          type: integer
          example: 500000
        currency:
          type: string
          example: IRR
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          example: SUCCEEDED
        reason:
          type: string
          nullable: true
          example: Customer request cancellation
        failureReason:
          type: string
          nullable: true
        providerRefundId:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          nullable: true
        requestedById:
          type: string
          nullable: true
        processedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          example: clh1234560000yy0877777777
        gamingCenterId:
          type: string
        paymentId:
          type: string
          nullable: true
        refundId:
          type: string
          nullable: true
        entryType:
          type: string
          enum:
          - PAYMENT
          - REFUND
          - COMMISSION
          - PAYOUT
          - ADJUSTMENT
          - TRANSFER
          example: PAYMENT
        amount:
          type: integer
          example: 1000000
        currency:
          type: string
          example: IRR
        idempotencyKey:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    NotificationLog:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
          example: SMS_IR
        recipient:
          type: string
          example: '0912***1234'
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
          - DELIVERED
        errorMessage:
          type: string
          nullable: true
        attempts:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Health Check
      tags:
      - System
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '500':
          $ref: '#/components/responses/InternalServerError'
