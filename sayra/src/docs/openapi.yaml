paths:
  /public/advertisements/slider:
    get:
      operationId: getPublicSliderAdvertisements
      summary: Get active advertisement slides for public banner slider
      description: Returns currently active and approved advertisements across the platform, sorted by priority.
      tags:
      - Public
      security: []
      responses:
        '200':
          description: List of active slider advertisements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                          nullable: true
                        bannerUrl:
                          type: string
                        mediaType:
                          type: string
                        destinationUrl:
                          type: string
                          nullable: true
                        priority:
                          type: integer
                        startDate:
                          type: string
                          format: date-time
                        endDate:
                          type: string
                          format: date-time
                        gamingCenterName:
                          type: string
                        gamingCenterSlug:
                          type: string
  /public/gamingCenters/{gamingCenterSlug}/advertisements/slider:
    get:
      operationId: getPublicCenterSliderAdvertisements
      summary: Get active advertisement slides for a specific gaming center banner slider
      description: Returns currently approved and active advertisements specifically for the specified gaming center, sorted by priority.
      tags:
      - Public
      security: []
      parameters:
      - name: gamingCenterSlug
        in: path
        required: true
        description: Unique slug of the gaming center
        schema:
          type: string
      responses:
        '200':
          description: List of active slider advertisements for the center
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                          nullable: true
                        bannerUrl:
                          type: string
                        mediaType:
                          type: string
                        destinationUrl:
                          type: string
                          nullable: true
                        priority:
                          type: integer
                        startDate:
                          type: string
                          format: date-time
                        endDate:
                          type: string
                          format: date-time
                        gamingCenterName:
                          type: string
                        gamingCenterSlug:
                          type: string
  /gamingCenters/{gamingCenterId}/advertisements:
    get:
      operationId: listCenterAdvertisements
      summary: List advertisements for a gaming center
      description: Returns paginated list of advertisements created by the gaming center owner.
      tags:
      - Advertisements
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, APPROVED, REJECTED, ACTIVE, EXPIRED, DELETED]
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of advertisements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdvertisementRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      operationId: createCenterAdvertisement
      summary: Submit a new advertisement request
      description: Creates a new advertisement request in PENDING status for admin review.
      tags:
      - Advertisements
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdvertisementInput'
      responses:
        '201':
          description: Advertisement request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AdvertisementRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
  /gamingCenters/{gamingCenterId}/advertisements/upload:
    post:
      operationId: uploadAdvertisementBanner
      summary: Upload an advertisement banner image
      description: Validates and stores a banner image, returning original and thumbnail URLs.
      tags:
      - Advertisements
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - banner
              properties:
                banner:
                  type: string
                  format: binary
      responses:
        '200':
          description: Banner image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                      thumbUrl:
                        type: string
  /gamingCenters/{gamingCenterId}/advertisements/{id}:
    get:
      operationId: getCenterAdvertisementById
      summary: Get advertisement details
      description: Returns details of a specific advertisement belonging to the gaming center.
      tags:
      - Advertisements
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Advertisement details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AdvertisementRequest'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateCenterAdvertisement
      summary: Update a pending advertisement request
      description: Modifies details of an advertisement while it remains in PENDING status.
      tags:
      - Advertisements
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                bannerUrl:
                  type: string
                destinationUrl:
                  type: string
                proposedDurationDays:
                  type: integer
      responses:
        '200':
          description: Advertisement updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AdvertisementRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteCenterAdvertisement
      summary: Cancel / delete an advertisement request
      description: Soft deletes the advertisement request.
      tags:
      - Advertisements
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Advertisement deleted
  /platform-admin/ad-requests:
    get:
      operationId: listPlatformAdRequests
      summary: List all advertisement requests across platform
      description: Returns paginated list of all advertisement requests for Platform Admin review.
      tags:
      - PlatformAdmin
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
