        description: Unique key to prevent duplicate checkouts
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - startTime
              - items
              - customer
              properties:
                startTime:
                  type: string
                  format: date-time
                durationMinutes:
                  type: integer
                  default: 60
                items:
                  type: array
                  items:
                    type: object
                    required:
                    - stationId
                    properties:
                      stationId:
                        type: string
                      staffId:
                        type: string
                customer:
                  type: object
                  required:
                  - fullName
                  - phone
                  properties:
                    fullName:
                      type: string
                    phone:
                      type: string
                    email:
                      type: string
                note:
                  type: string
                provider:
                  type: string
      responses:
        '201':
          description: Booking hold created and payment checkout URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      holdId:
                        type: string
                      paymentId:
                        type: string
                      paymentStatus:
                        type: string
                      holdExpiresAt:
                        type: string
                        format: date-time
                      paymentUrl:
                        type: string
                      totalAmount:
                        type: integer
                      currency:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Slot not available
        '500':
          $ref: '#/components/responses/InternalServerError'

