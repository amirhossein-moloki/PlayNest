openapi: 3.0.0
info:
  title: Playenest API
  description: API Documentation for Playenest Gamenet Management System
  version: v1.0-LOCKED
  x-api-contract-version: v1.0-LOCKED
  contact:
    name: Playenest Support
    email: support@playenest.com
servers:
- url: /api/v1
  description: V1 API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token for authenticated user sessions
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Static API Key required for /api/v1 endpoints
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Unique error code for machine handling
              enum:
              - INTERNAL_ERROR
              - APP_ERROR
              - VALIDATION_ERROR
              - DB_REQUEST_FAILED
              - NOT_FOUND
              - CONFLICT
              - UNAUTHORIZED
              - FORBIDDEN
              - SLOT_NOT_AVAILABLE
              - RESERVATION_OVERLAP
              - OVERLAP_CONFLICT
              - RESERVATION_START_TIME_IN_PAST
              - INVALID_TRANSITION
              - ONLINE_RESERVATION_DISABLED
              - IDEMPOTENCY_KEY_REQUIRED
              - IDEMPOTENCY_KEY_INVALID_LENGTH
              - IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD
              - IDEMPOTENCY_REQUEST_IN_PROGRESS
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error message
              example: Invalid request payload.
            details:
              type: object
              description: Optional additional error details (e.g., validation issues)
              nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - MANAGER
          - SUPERVISOR
          - STAFF
          - TRAINEE
          - SUPPORT
          - ADMIN
        isActive:
          type: boolean
    Ticket:
      type: object
      properties:
        id:
          type: string
        customerAccountId:
          type: string
        assignedToUserId:
          type: string
          nullable: true
        subject:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - PENDING
          - ANSWERED
          - CLOSED
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        category:
          type: string
          enum:
          - TECHNICAL
          - FINANCIAL
          - SALES
          - ACCOUNT
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
    TicketMessage:
      type: object
      properties:
        id:
          type: string
        ticketId:
          type: string
        senderId:
          type: string
        senderType:
          type: string
          enum:
          - USER
          - SUPPORT
        text:
          type: string
        attachment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    GamingCenter:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    GameStation:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        name:
          type: string
        stationType:
          type: string
          enum:
          - PC
          - PLAYSTATION
          - XBOX
          - SWITCH
          - VR
        isVip:
          type: boolean
        hourlyPrice:
          type: number
        minRentHours:
          type: integer
        maxRentHours:
          type: integer
        defaultDurationHours:
          type: integer
        incrementMinutes:
          type: integer
        isActive:
          type: boolean
    Reservation:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        stationId:
          type: string
        staffId:
          type: string
        customerAccountId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
          - NO_SHOW
        paymentState:
          type: string
          enum:
          - UNPAID
          - PENDING
          - PARTIALLY_PAID
          - PAID
          - REFUNDED
          - OVERPAID
          - FAILED
          - CANCELED
        totalHours:
          type: number
        totalPrice:
          type: number
        stationSnapshot:
          type: object
          properties:
            name:
              type: string
            hourlyPrice:
              type: number
            stationType:
              type: string
    ReservationTimeProposal:
      type: object
      properties:
        id:
          type: string
        reservationId:
          type: string
        originalStartTime:
          type: string
          format: date-time
        originalEndTime:
          type: string
          format: date-time
        proposedStartTime:
          type: string
          format: date-time
        proposedEndTime:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - CANCELLED
        createdByUserId:
          type: string
        customerRespondedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Staff:
      type: object
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          isPublic:
            type: boolean
          publicName:
            type: string
          bio:
            type: string
          avatarUrl:
            type: string
    Customer:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        fullName:
          type: string
        phoneVerifiedAt:
          type: string
          format: date-time
    Meta:
      type: object
      properties:
        requestId:
          type: string
          example: ckv1abc...
        pagination:
          type: object
          properties:
            totalItems:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    Pagination:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/Meta'
    Settings:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        timeZone:
          type: string
        workStartTime:
          type: string
        workEndTime:
          type: string
        allowOnlineBooking:
          type: boolean
        onlineBookingAutoConfirm:
          type: boolean
        preventOverlaps:
          type: boolean
    SiteSettings:
      type: object
      properties:
        logoUrl:
          type: string
        faviconUrl:
          type: string
        defaultSeoTitle:
          type: string
        defaultSeoDescription:
          type: string
        robotsIndex:
          type: string
          enum:
          - INDEX
          - NOINDEX
        robotsFollow:
          type: string
          enum:
          - FOLLOW
          - NOFOLLOW
    CommissionPolicy:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        type:
          type: string
          enum:
          - PERCENT
          - FIXED
        percentBps:
          type: integer
        fixedAmount:
          type: integer
        currency:
          type: string
        monthlyTarget:
          type: integer
          nullable: true
        maxPercentBps:
          type: integer
        isActive:
          type: boolean
    Earning:
      type: object
      properties:
        id:
          type: string
        reservationId:
          type: string
        gamingCenterId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACCRUED
          - CHARGED
          - WAIVED
          - REFUNDED
        commissionAmount:
          type: integer
        currency:
          type: string
        targetPeriod:
          type: string
          nullable: true
        targetReached:
          type: boolean
        targetContribution:
          type: boolean
    Rating:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        reservationId:
          type: string
        rating:
          type: integer
        comment:
          type: string
        status:
          type: string
          enum:
          - PUBLISHED
          - HIDDEN
          - DELETED
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
          - RESERVATION_CREATED
          - RESERVATION_CONFIRMED
          - RESERVATION_REJECTED
          - RESERVATION_CANCELLED
          - RESERVATION_TIME_PROPOSED
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Discount:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        targetType:
          type: string
          enum:
          - GAMING_CENTER
          - STATION
        targetId:
          type: string
        valueType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED_AMOUNT
        value:
          type: number
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WaitlistEntry:
      type: object
      properties:
        id:
          type: string
        gamingCenterId:
          type: string
        customerAccountId:
          type: string
        customerProfileId:
          type: string
        stationId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - OFFERED
          - CONVERTED
          - CANCELLED
          - EXPIRED
          - CLOSED
        note:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        convertedReservationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WaitlistOffer:
      type: object
      properties:
        id:
          type: string
        waitlistEntryId:
          type: string
        gamingCenterId:
          type: string
        stationId:
          type: string
        offeredStartTime:
          type: string
          format: date-time
        offeredEndTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - CANCELLED
        expiresAt:
          type: string
          format: date-time
        reservationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Health Check
      tags:
      - System
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      operationId: get_health
      description: Health Check
  /gamingCenters/{gamingCenterId}/discounts:
    get:
      summary: List discounts
      tags:
      - Discounts
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: targetType
        in: query
        schema:
          type: string
          enum:
          - GAMING_CENTER
          - STATION
      - name: targetId
        in: query
        schema:
          type: string
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List of discounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: get_gamingCenters_gamingCenterId_discounts
      description: List discounts
    post:
      summary: Create a new discount
      tags:
      - Discounts
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetType
              - targetId
              - valueType
              - value
              - startAt
              - endAt
              properties:
                targetType:
                  type: string
                  enum:
                  - GAMING_CENTER
                  - STATION
                targetId:
                  type: string
                valueType:
                  type: string
                  enum:
                  - PERCENTAGE
                  - FIXED_AMOUNT
                value:
                  type: number
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                isActive:
                  type: boolean
      responses:
        '201':
          description: Discount created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: post_gamingCenters_gamingCenterId_discounts
      description: Create a new discount
  /gamingCenters/{gamingCenterId}/discounts/{id}:
    get:
      summary: Get discount by ID
      tags:
      - Discounts
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Discount details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      operationId: get_gamingCenters_gamingCenterId_discounts_id
      description: Get discount by ID
    patch:
      summary: Update discount details
      tags:
      - Discounts
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetType:
                  type: string
                  enum:
                  - GAMING_CENTER
                  - STATION
                targetId:
                  type: string
                valueType:
                  type: string
                  enum:
                  - PERCENTAGE
                  - FIXED_AMOUNT
                value:
                  type: number
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                isActive:
                  type: boolean
      responses:
        '200':
          description: Discount updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      operationId: patch_gamingCenters_gamingCenterId_discounts_id
      description: Update discount details
    delete:
      summary: Delete discount
      tags:
      - Discounts
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Discount deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      operationId: delete_gamingCenters_gamingCenterId_discounts_id
      description: Delete discount
  /gamingCenters/{gamingCenterId}/discounts/{id}/status:
    patch:
      summary: Activate or deactivate discount
      tags:
      - Discounts
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Discount status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      operationId: patch_gamingCenters_gamingCenterId_discounts_id_status
      description: Activate or deactivate discount
  /notifications:
    get:
      summary: Get user notifications
      tags:
      - Notifications
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      - name: isRead
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Paginated notifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: get_notifications
      description: Get user notifications
  /notifications/unread-count:
    get:
      summary: Get unread notification count
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Count of unread notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: get_notifications_unread-count
      description: Get unread notification count
  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      tags:
      - Notifications
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      operationId: patch_notifications_id_read
      description: Mark notification as read
  /gamingCenters/{gamingCenterId}/reservation/{reservationId}/propose-time:
    post:
      summary: Propose a new reservation time (Owner/Staff)
      tags:
      - Reservation
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - startTime
              - endTime
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        '201':
          description: Time proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      operationId: post_gamingCenters_gamingCenterId_reservation_reservationId_propose-time
      description: Propose a new reservation time (Owner/Staff)
  /gamingCenters/{gamingCenterId}/reservation/{reservationId}/proposals:
    get:
      summary: List time proposals for reservation (Owner/Staff)
      tags:
      - Reservation
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      operationId: get_gamingCenters_gamingCenterId_reservation_reservationId_proposals
      description: List time proposals for reservation (Owner/Staff)
  /gamingCenters/{gamingCenterId}/reservations/{reservationId}/sessions/pause:
    post:
      summary: Pause a gaming session for a reservation
      tags:
      - GamingSessions
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Session paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
