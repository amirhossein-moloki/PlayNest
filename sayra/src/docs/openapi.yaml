  /gamingCenters/{gamingCenterId}/blog/posts:
    get:
      summary: List blog posts
      description: Retrieve a paginated list of blog posts for a gaming center with
        filtering by status, category, author, or search term.
      operationId: get_blog_posts
      tags:
      - Blog
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
      - name: authorId
        in: query
        required: false
        schema:
          type: string
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Paginated list retrieved
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/BlogPost'
                    meta:
                      $ref: '#/components/schemas/Meta'
    post:
      summary: Create blog post
      description: Create a new blog post. Requires author role (STAFF, SUPERVISOR,
        MANAGER, ADMIN).
      operationId: create_blog_post
      tags:
      - Blog
      security:
      - bearerAuth: []
      parameters:
      - name: gamingCenterId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              - title
              - excerpt
              - content
              properties:
                slug:
                  type: string
                  pattern: ^[a-z0-9-]+$
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                excerpt:
                  type: string
                  minLength: 1
                content:
                  type: string
                  minLength: 1
                categoryId:
                  type: string
                seriesId:
                  type: string
                coverMediaId:
                  type: string
                ogImageId:
                  type: string
                seoTitle:
                  type: string
                  maxLength: 255
                seoDescription:
                  type: string
                status:
                  type: string
                  enum:
                  - DRAFT
                  - PUBLISHED
                  - ARCHIVED
                  default: DRAFT
                visibility:
                  type: string
                  enum:
                  - PUBLIC
                  - PRIVATE
                  - MEMBERS_ONLY
                  default: PUBLIC
                publishedAt:
                  type: string
                  format: date-time
                scheduledAt:
                  type: string
                  format: date-time
                isHot:
                  type: boolean
                  default: false
                tagIds:
                  type: array
                  items:
                    type: string
                  maxItems: 50
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BlogPost'
