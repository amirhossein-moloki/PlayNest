openapi: 3.0.0
info:
  title: Playenest API
  description: API Documentation for Playenest Gamenet Management System
  version: v1.0-LOCKED
  x-api-contract-version: v1.0-LOCKED
  contact:
    name: Playenest Support
    email: support@playenest.com
servers:
- url: /api/v1
  description: V1 API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token for authenticated user sessions
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CustomerWalletOverview:
      type: object
      properties:
        walletBalance:
          type: integer
          example: 1000000
        reservedBalance:
          type: integer
          example: 200000
        availableBalance:
          type: integer
          example: 800000
        currency:
          type: string
          example: IRR
        canWithdraw:
          type: boolean
          example: true
        lastWithdrawalRequestAt:
          type: string
          format: date-time
          nullable: true
        nextAllowedWithdrawalAt:
          type: string
          format: date-time
          nullable: true
    RequestWithdrawalInput:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          minimum: 1
          example: 200000
        bankDetails:
          type: object
          properties:
            sheba:
              type: string
              example: IR123456789012345678901234
            cardNumber:
              type: string
              example: '6037991812345678'
            accountHolderName:
              type: string
              example: رضا رضایی
            bankName:
              type: string
              example: بانک ملی
        note:
          type: string
          example: برداشت موجودی به حساب بانکی
    WithdrawalRequestItem:
      type: object
      properties:
        id:
          type: string
        customerAccountId:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, PROCESSING, PAID, FAILED, CANCELLED]
        rejectionReason:
          type: string
          nullable: true
        paymentReference:
          type: string
          nullable: true
        bankDetails:
          type: object
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    IranCalendarDaysResponse:
      type: object
      required:
      - calendar
      - from
      - to
      - totalDays
      - days
      properties:
        calendar:
          type: string
          example: iranian
        from:
          type: string
          example: '1405-01-01'
        to:
          type: string
          example: '1405-01-31'
        totalDays:
          type: integer
          example: 31
        days:
          type: array
          items:
            $ref: '#/components/schemas/IranCalendarDayItem'
    IranCalendarDayItem:
      type: object
      required:
      - date
      - year
      - month
      - monthName
      - day
      - dayOfWeek
      - dayOfWeekName
      - dayOfYear
      - isWeekend
      - isHoliday
      - holidayType
      - isToday
      properties:
        date:
          type: string
          example: '1405-01-01'
        year:
          type: integer
          example: 1405
        month:
          type: integer
          example: 1
        monthName:
          type: string
          example: فروردین
        day:
          type: integer
          example: 1
        dayOfWeek:
          type: integer
          example: 0
        dayOfWeekName:
          type: string
          example: شنبه
        dayOfYear:
          type: integer
          example: 1
        isWeekend:
          type: boolean
          example: false
        isHoliday:
          type: boolean
          example: true
        holidayType:
          type: string
          enum: [official, weekend, none]
          example: official
        isToday:
          type: boolean
          example: false
        relativeDay:
          type: string
          nullable: true
          example: today
        relativeDayName:
          type: string
          nullable: true
          example: امروز
        isOfficialCalendarPublished:
          type: boolean
          example: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/IranCalendarEventItem'
    IranCalendarEventItem:
      type: object
      required:
      - title
      - type
      properties:
        title:
          type: string
          example: عید نوروز
        type:
          type: string
          example: national
        isHoliday:
          type: boolean
          example: true
        source:
          type: string
          example: official_calendar
        verified:
          type: boolean
          example: true
    IranCalendarErrorResponse:
      type: object
      required:
      - success
      - message
      - errors
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid Jalali date
        errors:
          type: object
          additionalProperties:
            type: string
    DeviceType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        category:
          type: string
          enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDeviceTypeInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
          enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
          default: PC
        isActive:
          type: boolean
          default: true

    UpdateDeviceTypeInput:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
          enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
        isActive:
          type: boolean

    DeviceCatalog:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        deviceType:
          type: string
          enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
        deviceTypeId:
          type: string
          nullable: true
        deviceTypeRef:
          $ref: '#/components/schemas/DeviceType'
        coverImageUrl:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GameCatalog:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        coverImageUrl:
          type: string
          format: uri
        supportedPlatforms:
          type: array
          items:
            type: string
            enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
        genre:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDeviceCatalogInput:
      type: object
      required:
        - name
        - coverImageUrl
      properties:
        name:
          type: string
        deviceType:
          type: string
          enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
          default: PC
        coverImageUrl:
          type: string
          format: uri
        description:
          type: string
        isActive:
          type: boolean
          default: true

    UpdateDeviceCatalogInput:
      type: object
      properties:
        name:
          type: string
        deviceType:
          type: string
          enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
        coverImageUrl:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        isActive:
          type: boolean

    CreateGameCatalogInput:
      type: object
      required:
        - title
        - coverImageUrl
      properties:
        title:
          type: string
        coverImageUrl:
          type: string
          format: uri
        supportedPlatforms:
          type: array
          items:
            type: string
            enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
          default: [PC]
        genre:
          type: string
        description:
          type: string
        isActive:
          type: boolean
          default: true

    UpdateGameCatalogInput:
      type: object
      properties:
        title:
          type: string
        coverImageUrl:
          type: string
          format: uri
        supportedPlatforms:
          type: array
          items:
            type: string
            enum: [PC, PLAYSTATION, XBOX, SWITCH, VR]
        genre:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isActive:
          type: boolean

    CreateStationsFromCatalogInput:
      type: object
      required:
        - catalogDeviceId
        - quantity
        - hourlyPrice
      properties:
        catalogDeviceId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        hourlyPrice:
          type: number
          minimum: 0
        customNamePrefix:
          type: string
        isVip:
          type: boolean
          default: false
        minRentHours:
          type: integer
          default: 1
        maxRentHours:
          type: integer
          default: 8
        defaultDurationHours:
          type: integer
          default: 1
        incrementMinutes:
          type: integer
          default: 30

    AddGamesFromCatalogInput:
      type: object
      required:
        - gameCatalogIds
      properties:
        gameCatalogIds:
          type: array
          items:
            type: string

    PlatformCampaign:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        code:
          type: string
        description:
          type: string
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
        discountValue:
          type: number
        maxDiscountAmount:
          type: number
        minOrderAmount:
          type: number
        scopeType:
          type: string
          enum: [GLOBAL, SPECIFIC_GAMECENTERS, SPECIFIC_DEVICE_TYPES]
        applicableGamecenterIds:
          type: array
          items:
            type: string
        applicableDeviceTypes:
          type: array
          items:
            type: string
        targetAudience:
          type: string
          enum: [ALL_USERS, NEW_USERS, LOYAL_USERS, SPECIFIC_USERS]
        specificUserIds:
          type: array
          items:
            type: string
        totalUsageLimit:
          type: integer
        perUserUsageLimit:
          type: integer
        usedCount:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SCHEDULED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
    CreatePlatformCampaignInput:
      type: object
      required:
      - title
      - code
      - discountType
      - discountValue
      - startDate
      - endDate
      properties:
        title:
          type: string
        code:
          type: string
        description:
          type: string
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
        discountValue:
          type: number
        maxDiscountAmount:
          type: number
        minOrderAmount:
          type: number
        scopeType:
          type: string
          enum: [GLOBAL, SPECIFIC_GAMECENTERS, SPECIFIC_DEVICE_TYPES]
        applicableGamecenterIds:
          type: array
          items:
            type: string
        applicableDeviceTypes:
          type: array
          items:
            type: string
        targetAudience:
          type: string
          enum: [ALL_USERS, NEW_USERS, LOYAL_USERS, SPECIFIC_USERS]
        specificUserIds:
          type: array
          items:
            type: string
        totalUsageLimit:
          type: integer
        perUserUsageLimit:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SCHEDULED, EXPIRED]
    UpdatePlatformCampaignInput:
      type: object
      properties:
        title:
          type: string
        code:
          type: string
        description:
          type: string
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
        discountValue:
          type: number
        maxDiscountAmount:
          type: number
        minOrderAmount:
          type: number
        scopeType:
          type: string
          enum: [GLOBAL, SPECIFIC_GAMECENTERS, SPECIFIC_DEVICE_TYPES]
        applicableGamecenterIds:
          type: array
          items:
            type: string
        applicableDeviceTypes:
          type: array
          items:
            type: string
        targetAudience:
          type: string
          enum: [ALL_USERS, NEW_USERS, LOYAL_USERS, SPECIFIC_USERS]
        specificUserIds:
          type: array
          items:
            type: string
        totalUsageLimit:
          type: integer
        perUserUsageLimit:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SCHEDULED, EXPIRED]
    PlatformSetting:
      type: object
      properties:
        siteTitle:
          type: string
        supportPhone:
          type: string
        supportEmail:
          type: string
        centralAddress:
          type: string
        maintenanceMode:
          type: boolean
        maintenanceMessage:
          type: string
        platformCommissionPercent:
          type: number
        maxAdvanceBookingDays:
          type: integer
        onlinePaymentTimeoutMinutes:
          type: integer
        cancellationPenaltyPercent:
          type: number
        freeCancellationHours:
          type: integer
        autoSendBookingSms:
          type: boolean
        autoSendReminderSms:
          type: boolean
        welcomeSmsTemplate:
          type: string
        bookingConfirmationSmsTemplate:
          type: string
        bookingReminderSmsTemplate:
          type: string
        reviewApprovalPolicy:
          type: string
          enum: [AUTO, MANUAL]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlatformSettingsWithInfrastructure:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/PlatformSetting'
        infrastructure:
          type: object
          properties:
            smsGatewayStatus:
              type: string
            smsProvider:
              type: string
            paymentGatewayStatus:
              type: string
            paymentProvider:
              type: string
            sslStatus:
              type: string
            apiVersion:
              type: string
            lastSuccessfulBackupAt:
              type: string
    UpdatePlatformSettingsInput:
      type: object
      properties:
        siteTitle:
          type: string
        supportPhone:
          type: string
        supportEmail:
          type: string
        centralAddress:
          type: string
        maintenanceMode:
          type: boolean
        maintenanceMessage:
          type: string
        platformCommissionPercent:
          type: number
        maxAdvanceBookingDays:
          type: integer
        onlinePaymentTimeoutMinutes:
          type: integer
        cancellationPenaltyPercent:
          type: number
        freeCancellationHours:
          type: integer
        autoSendBookingSms:
          type: boolean
        autoSendReminderSms:
          type: boolean
        welcomeSmsTemplate:
          type: string
        bookingConfirmationSmsTemplate:
          type: string
        bookingReminderSmsTemplate:
          type: string
        reviewApprovalPolicy:
          type: string
          enum: [AUTO, MANUAL]
    CreatePlatformUserInput:
      type: object
      required:
      - gamingCenterId
      - firstName
      - lastName
      - phone
      properties:
        gamingCenterId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [MANAGER, ADMIN]
        isActive:
          type: boolean
    UpdatePlatformUserInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        bio:
          type: string
        publicName:
          type: string
        isPublic:
          type: boolean
    PlatformAnalyticsReport:
      type: object
      properties:
        period:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
        financials:
          type: object
          properties:
            totalRevenue:
              type: number
            totalPaidAmount:
              type: number
            totalRefundAmount:
              type: number
            totalDiscountAmount:
              type: number
            platformCommission:
              type: number
            gamingCentersRevenue:
              type: number
            averageReservationValue:
              type: number
        reservations:
          type: object
          properties:
            totalReservations:
              type: integer
            confirmedReservations:
              type: integer
            pendingReservations:
              type: integer
            cancelledReservations:
              type: integer
            completedReservations:
              type: integer
            expiredReservations:
              type: integer
            cancellationRate:
              type: number
            averageReservationDuration:
              type: number
        users:
          type: object
          properties:
            totalUsers:
              type: integer
            newUsers:
              type: integer
            activeUsers:
              type: integer
            returningUsers:
              type: integer
        gamingCenters:
          type: object
          properties:
            totalGamingCenters:
              type: integer
            activeGamingCenters:
              type: integer
            inactiveGamingCenters:
              type: integer
            totalStations:
              type: integer
            averageReservationsPerGamingCenter:
              type: number
            topGamingCenters:
              type: array
              items:
                type: object
        timeSeries:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              reservationCount:
                type: integer
              revenue:
                type: number
              discountAmount:
                type: number
              cancellationCount:
                type: integer
              newUsers:
                type: integer
        comparison:
          type: object
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Unique error code for machine handling
              enum:
              - INTERNAL_ERROR
              - APP_ERROR
              - VALIDATION_ERROR
              - DB_REQUEST_FAILED
              - NOT_FOUND
              - CONFLICT
              - UNAUTHORIZED
              - FORBIDDEN
              - SLOT_NOT_AVAILABLE
              - RESERVATION_OVERLAP
              - OVERLAP_CONFLICT
              - RESERVATION_START_TIME_IN_PAST
              - INVALID_TRANSITION
              - ONLINE_RESERVATION_DISABLED
              - IDEMPOTENCY_KEY_REQUIRED
              - IDEMPOTENCY_KEY_INVALID_LENGTH
              - IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD
              - IDEMPOTENCY_REQUEST_IN_PROGRESS
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error message
              example: Invalid request payload.
            details:
              type: object
              description: Optional additional error details (e.g., validation issues)
              nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'
    PlatformAdminLoginResponse:
      type: object
      properties:
        admin:
          $ref: '#/components/schemas/PlatformAdmin'
        accessToken:
          type: string
        refreshToken:
          type: string
        tokens:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
    User:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - MANAGER
          - ADMIN
        isActive:
          type: boolean
    Ticket:
      type: object
      properties:
        id:
          type: string
        customerAccountId:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true
        gamingCenterId:
          type: string
          nullable: true
        assignedToUserId:
          type: string
          nullable: true
        subject:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - PENDING
          - ANSWERED
          - CLOSED
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        category:
          type: string
          enum:
          - TECHNICAL
          - FINANCIAL
          - SALES
          - ACCOUNT
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
    TicketMessage:
      type: object
      properties:
        id:
          type: string
        ticketId:
          type: string
        senderId:
          type: string
        senderType:
          type: string
          enum:
          - USER
          - SUPPORT
        text:
          type: string
        attachment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    GamingCenter:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        description:
          type: string
        hasDiscount:
          type: boolean
          description: Indicates whether the gaming center currently has any active discounts or campaigns
        has_discount:
          type: boolean
          description: Snake_case alias for hasDiscount
        coverImages:
          type: array
          description: List of cover image URLs for the gaming center
          items:
            type: string
        coverImageUrl:
          type: string
          nullable: true
          description: Primary cover image URL for the gaming center
        banner:
          type: string
          nullable: true
          description: Banner image URL of the gaming center (null if not available)
        pricing:
          type: object
          description: Pricing and active discount details for the gaming center
          properties:
            originalPrice:
              type: number
              description: Original hourly rate without discount
            discountPercentage:
              type: number
              description: Active discount percentage (0 if no discount)
            discountAmount:
              type: number
              description: Calculated discount amount (0 if no discount)
            finalPrice:
              type: number
              description: Final hourly rate after discount
            hasDiscount:
              type: boolean
              description: Indicates whether an active discount exists
          required:
            - originalPrice
            - discountPercentage
            - discountAmount
            - finalPrice
            - hasDiscount
        managerId:
          type: string
          nullable: true
          description: Unique ID of the manager user managing this gaming center (1-to-1 relationship)
        cancellationHours:
          type: integer
          example: 2
          description: Hours before reservation start time within which cancellation is permitted
        hourlyRate:
          type: number
          description: Lowest hourly rate among registered active stations (or fallback default hourly rate)
        pcCount:
          type: integer
          description: Number of PC gaming stations
        consoleCount:
          type: integer
