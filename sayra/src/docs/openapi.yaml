  /iran-calendar/days:
    get:
      operationId: getIranCalendarDays
      summary: Get Iranian official calendar days for a date range
      description: Returns all calendar days for a Jalali date range including holiday status, official/national/religious events, and relative date indicators calculated according to Asia/Tehran timezone.
      tags:
      - Calendar
      security: []
      parameters:
      - name: from
        in: query
        required: true
        description: Start of the date range in Jalali calendar (YYYY-MM-DD)
        schema:
          type: string
          example: '1405-01-01'
      - name: to
        in: query
        required: true
        description: End of the date range in Jalali calendar (YYYY-MM-DD)
        schema:
          type: string
          example: '1405-01-31'
      - name: includeEvents
        in: query
        required: false
        description: Whether to include calendar events
        schema:
          type: boolean
          default: true
      - name: includeHolidays
        in: query
        required: false
        description: Whether to include holiday calculations
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: List of Iranian calendar days for the requested interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IranCalendarDaysResponse'
        '400':
          description: Invalid Jalali date or date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IranCalendarErrorResponse'
